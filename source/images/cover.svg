<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.16" y2="1">
      <stop offset="0%" stop-color="#080e1c"/>
      <stop offset="42%" stop-color="#132039"/>
      <stop offset="76%" stop-color="#22375c"/>
      <stop offset="100%" stop-color="#3b5683"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#eaf2ff" stop-opacity="0.52"/>
      <stop offset="52%" stop-color="#a8c8ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a8c8ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moon" cx="0.38" cy="0.34" r="0.72">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="68%" stop-color="#eaf0fb"/>
      <stop offset="100%" stop-color="#c8d6ea"/>
    </radialGradient>

    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fb6f0" stop-opacity="0"/>
      <stop offset="34%" stop-color="#b9d2f5" stop-opacity="0.26"/>
      <stop offset="66%" stop-color="#8fb6f0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8fb6f0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3f5f"/>
      <stop offset="100%" stop-color="#182741"/>
    </linearGradient>

    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16233a"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>

    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe3ff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#8fb6f0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8fb6f0" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur40" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur10" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blur4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- 月与光晕 -->
  <circle cx="596" cy="146" r="236" fill="url(#halo)"/>
  <circle cx="596" cy="146" r="60" fill="url(#moon)"/>
  <circle cx="596" cy="146" r="90" fill="#cfe0ff" opacity="0.10" filter="url(#blur10)"/>

  <!-- 银河带 -->
  <g filter="url(#blur40)">
    <ellipse cx="330" cy="252" rx="430" ry="56" fill="url(#band)" transform="rotate(-9 330 252)"/>
  </g>

  <!-- 星点 -->
  <g fill="#ffffff">
    <circle cx="62" cy="58" r="1.4" opacity="0.75"/>
    <circle cx="128" cy="118" r="1" opacity="0.5"/>
    <circle cx="196" cy="52" r="1.6" opacity="0.7"/>
    <circle cx="252" cy="146" r="1.1" opacity="0.5"/>
    <circle cx="318" cy="80" r="1.3" opacity="0.6"/>
    <circle cx="386" cy="158" r="0.9" opacity="0.42"/>
    <circle cx="442" cy="62" r="1.5" opacity="0.68"/>
    <circle cx="508" cy="128" r="1" opacity="0.5"/>
    <circle cx="684" cy="78" r="1.4" opacity="0.62"/>
    <circle cx="736" cy="168" r="1.1" opacity="0.5"/>
    <circle cx="88" cy="206" r="1.2" opacity="0.45"/>
    <circle cx="176" cy="268" r="0.9" opacity="0.38"/>
    <circle cx="266" cy="212" r="1.3" opacity="0.5"/>
    <circle cx="362" cy="278" r="1" opacity="0.4"/>
    <circle cx="470" cy="228" r="1.2" opacity="0.46"/>
    <circle cx="566" cy="296" r="0.9" opacity="0.36"/>
    <circle cx="668" cy="244" r="1.4" opacity="0.5"/>
    <circle cx="744" cy="330" r="1" opacity="0.38"/>
    <circle cx="112" cy="342" r="1.1" opacity="0.4"/>
    <circle cx="228" cy="368" r="0.9" opacity="0.34"/>
    <circle cx="352" cy="352" r="1.2" opacity="0.42"/>
    <circle cx="498" cy="380" r="1" opacity="0.36"/>
    <circle cx="636" cy="362" r="1.1" opacity="0.4"/>
  </g>

  <!-- 零星暖色星火（领结黄点缀） -->
  <g fill="#e4bc4e">
    <circle cx="150" cy="176" r="1.1" opacity="0.5"/>
    <circle cx="404" cy="112" r="0.9" opacity="0.38"/>
    <circle cx="712" cy="292" r="1" opacity="0.34"/>
    <circle cx="286" cy="316" r="0.8" opacity="0.3"/>
  </g>

  <!-- 星之海：地平线银光 -->
  <rect x="0" y="414" width="800" height="46" fill="url(#sea)" filter="url(#blur10)" opacity="0.9"/>

  <!-- 远岸 -->
  <path d="M0 424 L96 396 L178 416 L268 384 L360 412 L452 386 L548 418 L648 392 L740 420 L800 402 L800 600 L0 600 Z"
        fill="url(#hillFar)" opacity="0.92"/>
  <!-- 近岸 -->
  <path d="M0 488 L112 448 L214 482 L324 436 L438 488 L556 448 L672 492 L800 458 L800 600 L0 600 Z"
        fill="url(#hillNear)"/>

  <!-- 水面碎光 -->
  <g opacity="0.30" filter="url(#blur4)">
    <ellipse cx="596" cy="470" rx="56" ry="6" fill="#dcebff"/>
    <ellipse cx="596" cy="498" rx="36" ry="5" fill="#dcebff" opacity="0.7"/>
    <ellipse cx="590" cy="524" rx="22" ry="4" fill="#dcebff" opacity="0.45"/>
    <ellipse cx="286" cy="512" rx="26" ry="3" fill="#cfe3ff" opacity="0.5"/>
  </g>
</svg>
